<div class="component-content">
  @if (rendering.fields) {
  <div class="field-promoicon">
    <sc-image [field]="$any(rendering.fields).PromoIcon"></sc-image>
  </div>
  <div class="promo-text">
    <div>
      <div class="field-promotext">
        <sc-rich-text [field]="$any(rendering.fields).PromoText"></sc-rich-text>
      </div>
    </div>
    <div class="field-promolink">
      <sc-link [field]="$any(rendering.fields).PromoLink"></sc-link>
    </div>
  </div>
  } @else {
  <span class="is-empty-hint">Promo</span>
  }
</div>
