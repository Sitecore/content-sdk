name: Pull Request Build

on:
  pull_request:
    branches:
      - dev
      - 'release/**'
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
          dotnet-quality: 'ga'

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      - name: Lint packages
        run: |
          yarn lint-packages

      - name: Verify API surface
        run: |
          set -o pipefail
          echo "🔍 Verifying API surface compatibility..."

          # Capture output from api-extractor:verify
          if ! yarn api-extractor:verify 2>&1 | tee /tmp/api-extractor-output.log; then
            echo ""
            echo "## 🔍 API Extractor Verification Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat /tmp/api-extractor-output.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🔧 How to fix" >> $GITHUB_STEP_SUMMARY
            echo "1. Run \`yarn api-extractor\` locally to update API reports" >> $GITHUB_STEP_SUMMARY
            echo "2. Review the changes in the generated .api.md files" >> $GITHUB_STEP_SUMMARY
            echo "3. Commit the updated API reports if the changes are intentional" >> $GITHUB_STEP_SUMMARY
            
            echo ""
            echo "❌ API Extractor verification failed!"
            exit 1
          fi
          echo "✅ API surface verification passed!"

      - name: Run tests and collect coverage
        run: yarn coverage-packages
        env:
          testEnv: ci
          IMPORT_ALIAS_STRATEGY: plain

      - name: Generate code coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: '**/cobertura-coverage.xml'
          targetdir: './coverlet'
          reporttypes: 'HtmlInline;MarkdownSummaryGithub;Cobertura'

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverlet

      - name: Publish coverage in build summary
        run: cat coverlet/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Scaffold samples
        run: yarn scaffold-samples
