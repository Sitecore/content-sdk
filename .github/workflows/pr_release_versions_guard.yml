name: Release Versions Guard

# PR check for release lines that publish to npm `latest` from a side branch. On the release PR
# (opened by changesets/action), fails when a version it bumps to is already on npm from another
# line or is lower than npm `latest` (scripts/release/guards/release-versions-guard.ts). Other PRs into
# these branches pass: they keep changesets or change no versions.
#
# Should be required on `release/limited/**` and `release/hotfix/**` branches

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'release/limited/**'
      - 'release/hotfix/**'

permissions:
  contents: read

concurrency:
  group: release-versions-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      # The default PR merge ref: the versions the merge would publish. Full history and tags for
      # the base commit and the "tagged on this line" check.
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          install: update

      - name: Check release versions against npm
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: yarn csdk:release-versions-guard

