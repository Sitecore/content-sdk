name: Release Branch Guards

# PR check for release branches (scripts/release/release-branch-guards.ts). The base branch picks the guards:
# - release/latest: release versions. Fails when a version the pending changesets would release
#   (release plan, cascade included) is not above npm `latest`: already published from dev, or
#   lower. PRs without pending changesets (the release PR) pass.
# - release/legacy/<product>: legacy changesets. Fails on changesets a legacy branch can't release: for a package
#   that resolves from npm (e.g. a cherry-picked core changeset; ship it from dev) or for
#   create-content-sdk-app (would stay pending and silently block publishing).
# Other release branches pass. Mark this check as required on these branches.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'release/latest'
      - 'release/legacy/*'

permissions:
  contents: read

concurrency:
  group: release-branch-guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      # The default PR merge ref: what the merge would bring to the release branch.
      - name: Checkout PR merge commit
        uses: actions/checkout@v4

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          install: update

      - name: Release branch guards
        run: node ./scripts/release/release-branch-guards.ts pr
