name: Limited Release Prep

# Product-based limited release: pick a product from `.changeset/products.config.json` (keep the
# `product` choices below in sync). The release ships that product with everything below it; the
# other products' packages are left out by removing their changesets (no changesets `ignore`): they
# keep their released version, so nothing may bump them and they must already be on npm. Packages
# that need a release on their own go through the hotfix flow.
#
# The workflow:
# 1. checks that every changeset names one package (pruning drops changesets naming a left-out
#    package, so a multi-package one would lose its in-scope part);
# 2. creates `release/limited/<product>-<timestamp>` from dev;
# 3. builds the cascade release plan and fails when it would bump a left-out package (or one isn't
#    on npm yet), then removes the left-out packages' changesets (they stay on dev);
# 4. on failure: reports in the job summary, nothing pushed; otherwise commits and pushes the
#    branch, which opens the limited release PR via publish.yml.
# The prep commit is never cherry-picked back to dev; only the version bump is.
on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to release'
        required: true
        type: choice
        options:
          - nextjs
          - angular

permissions:
  contents: write

jobs:
  prep-limited-release:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          token: ${{ steps.generate-token.outputs.token }}
          install: update

      - name: Verify one package per changeset
        run: yarn csdk:split-changesets --check

      - name: Create limited release branch
        id: prep
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail
          BRANCH_NAME="release/limited/${PRODUCT}-$(date -u +%Y%m%d%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH_NAME"
          # Validates the release (left-out packages, release plan) before anything is pushed.
          yarn csdk:prep-limited-release "$PRODUCT" 2>&1 | tee "$RUNNER_TEMP/prep-limited-release.log"
          git add -A .changeset
          git commit -m "[release][ci] Limited release: $PRODUCT"
          git push -u origin "$BRANCH_NAME"

      # Validation failed: the push is the prep step's last command, so nothing reached origin.
      - name: Report failure
        if: failure() && steps.prep.outcome == 'failure'
        env:
          BRANCH_NAME: ${{ steps.prep.outputs.branch_name }}
          PRODUCT: ${{ inputs.product }}
        run: |
          {
            echo "## ❌ Limited Release Aborted"
            echo ""
            echo "The \`$PRODUCT\` limited release failed validation; branch \`$BRANCH_NAME\` was not pushed."
            echo "Changes that would bump the other product's packages (e.g. a shared major cascading into"
            echo "them) must ship in a full release from dev."
            echo ""
            echo '```'
            grep -v '^\s*$' "$RUNNER_TEMP/prep-limited-release.log" | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        env:
          BRANCH_NAME: ${{ steps.prep.outputs.branch_name }}
          PRODUCT: ${{ inputs.product }}
        run: |
          {
            echo "## Limited Release Branch Prepared"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Release Branch** | \`$BRANCH_NAME\` |"
            echo "| **Product** | \`$PRODUCT\` |"
            echo ""
            echo "The other product's packages stay at their released version: their changesets were"
            echo "removed from the branch (they stay on dev). The push opens the limited release PR."
          } >> "$GITHUB_STEP_SUMMARY"
