name: Prepare Hotfix Release

# Branches `release/hotfix/<UTC timestamp>` off the `latest` git tag: the state of `v<latest>`` published release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Create hotfix branch
        id: create-branch
        run: |
          set -euo pipefail
          if ! BASE_SHA="$(git rev-parse --verify --quiet 'refs/tags/latest^{commit}')"; then
            echo "Git tag 'latest' not found. It is set by publish.yml after a release from dev, release/limited/* or release/hotfix/*."
            exit 1
          fi
          BRANCH_NAME="release/hotfix/$(date -u +%Y%m%d%H%M%S)"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null; then
            echo "Hotfix branch $BRANCH_NAME already exists. Re-run the workflow."
            exit 1
          fi
          git push origin "$BASE_SHA:refs/heads/$BRANCH_NAME"
          echo "Branch $BRANCH_NAME created from latest ($BASE_SHA) and pushed"
          {
            echo "branch_name=$BRANCH_NAME"
            echo "base_sha=$BASE_SHA"
            echo "base_release=$(git tag -l --format='%(contents:subject)' latest)"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
          BASE_SHA: ${{ steps.create-branch.outputs.base_sha }}
          BASE_RELEASE: ${{ steps.create-branch.outputs.base_release }}
        run: |
          {
            echo "## Hotfix Branch Prepared"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Hotfix Branch** | \`$BRANCH_NAME\` |"
            echo "| **Base** | \`latest\` tag at \`$BASE_SHA\` |"
            echo "| **Base Release** | $BASE_RELEASE |"
            echo ""
            echo "### Next Steps:"
            echo "1. Checkout the branch: \`git checkout $BRANCH_NAME\`"
            echo "2. Cherry-pick or add the fix, with its changeset (\`yarn changeset\`). Cherry-pick the dev commit including its changeset file so dev does not get a duplicate changelog entry"
            echo "3. Open PR(s) with the hotfix changes against \`$BRANCH_NAME\`"
            echo "4. Merging them updates the hotfix canaries and opens the hotfix release PR"
            echo "5. Merge the release PR to publish (\`latest\`); the version bump is cherry-picked back to dev"
          } >> "$GITHUB_STEP_SUMMARY"

