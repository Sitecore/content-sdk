name: Prepare Hotfix / Feature Release

# Branches `release/hotfix/<UTC timestamp>` off the head of `release/latest`, which holds strictly
# released code (publish.yml keeps it in sync after dev, limited and hotfix
# releases). The release ships only what is cherry-picked onto it from dev:
# - a hotfix: the fix commit(s);
# - a feature release: the commits of one feature, without the rest of dev;
# - a single package released on its own.
# Cherry-pick each commit with its changeset file (same name), so dev doesn't get a duplicate
# changelog entry when the version bump is cherry-picked back.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          token: ${{ steps.generate-token.outputs.token }}
          install: none

      - name: Create hotfix branch
        id: create-branch
        run: |
          set -euo pipefail
          if ! git fetch origin release/latest; then
            echo "Branch release/latest not found. publish.yml sets it after a release from dev, release/limited/* or release/hotfix/*."
            exit 1
          fi
          BASE_SHA="$(git rev-parse origin/release/latest)"
          BRANCH_NAME="release/hotfix/$(date -u +%Y%m%d%H%M%S)"
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null; then
            echo "Hotfix branch $BRANCH_NAME already exists. Re-run the workflow."
            exit 1
          fi
          git push origin "$BASE_SHA:refs/heads/$BRANCH_NAME"
          echo "Branch $BRANCH_NAME created from release/latest ($BASE_SHA) and pushed"
          {
            echo "branch_name=$BRANCH_NAME"
            echo "base_sha=$BASE_SHA"
            echo "base_release=$(git log -1 --format=%s "$BASE_SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BRANCH_NAME: ${{ steps.create-branch.outputs.branch_name }}
          BASE_SHA: ${{ steps.create-branch.outputs.base_sha }}
          BASE_RELEASE: ${{ steps.create-branch.outputs.base_release }}
        run: |
          {
            echo "## Hotfix / Feature Release Branch Prepared"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Hotfix Branch** | \`$BRANCH_NAME\` |"
            echo "| **Base** | \`release/latest\` at \`$BASE_SHA\` |"
            echo "| **Base Release** | $BASE_RELEASE |"
            echo ""
            echo "### Next Steps:"
            echo "1. Checkout the branch: \`git checkout $BRANCH_NAME\`"
            echo "2. Cherry-pick from dev the fix, or the commits of the feature to release, each with its changeset file (same name, so dev does not get a duplicate changelog entry). A change without a changeset needs one (\`yarn changeset:add\`)"
            echo "3. Open PR(s) with the cherry-picked changes against \`$BRANCH_NAME\`"
            echo "4. Merging them updates the hotfix canaries and opens the release PR"
            echo "5. Merge the release PR to publish (\`latest\`); the version bump is cherry-picked back to dev"
          } >> "$GITHUB_STEP_SUMMARY"

