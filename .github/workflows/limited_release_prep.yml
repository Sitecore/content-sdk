name: Limited Release Prep

# Product-based limited release: pick a product from `.changeset/products.json` (keep the `product`
# choices below in sync). The release ships that product with everything below it; the other
# products' packages are added to `.changeset/config.json` `ignore`. Packages that need a release
# on their own go through the hotfix flow.
#
# The workflow:
# 1. checks that every changeset names one package (pruning drops changesets naming an ignored
#    package, so a multi-package one would lose its in-scope part);
# 2. creates `release/limited/<product>-<timestamp>` from dev;
# 3. writes the ignore list, fails on a propagating major bump outside the product's own packages,
#    and removes the ignored packages' changesets (they stay on dev);
# 4. on failure: removes the branch and reports in the job summary; otherwise commits and pushes it,
#    which opens the limited release PR via publish.yml.
# The prep commit is never cherry-picked back to dev; only the version bump is.
on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to release'
        required: true
        type: choice
        options:
          - nextjs
          - angular

permissions:
  contents: write

jobs:
  prep-limited-release:
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install

      - name: Verify one package per changeset
        run: yarn csdk:split-changesets --check

      - name: Create limited release branch
        id: prep
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          set -euo pipefail
          BRANCH_NAME="release/limited/${PRODUCT}-$(date -u +%Y%m%d%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH_NAME"
          # Validates the release (ignore list, no propagating majors outside the product's own
          # packages) before anything is pushed.
          yarn csdk:prep-limited-release "$PRODUCT" 2>&1 | tee "$RUNNER_TEMP/prep-limited-release.log"
          git add -A .changeset
          git commit -m "[release][ci] Limited release: $PRODUCT"
          git push -u origin "$BRANCH_NAME"

      # Validation failed: nothing was pushed. Remove the branch and report why.
      - name: Remove branch on failure
        if: failure() && steps.prep.outcome == 'failure'
        env:
          BRANCH_NAME: ${{ steps.prep.outputs.branch_name }}
          PRODUCT: ${{ inputs.product }}
        run: |
          git checkout -q -f "${{ github.ref_name }}"
          git branch -D "$BRANCH_NAME" 2>/dev/null || true
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          {
            echo "## ❌ Limited Release Aborted"
            echo ""
            echo "The \`$PRODUCT\` limited release failed validation; branch \`$BRANCH_NAME\` was removed."
            echo "A propagating major bump outside the product's own packages (\`.changeset/products.json\`)"
            echo "must ship in a full release from dev."
            echo ""
            echo '```'
            grep -v '^\s*$' "$RUNNER_TEMP/prep-limited-release.log" | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        env:
          BRANCH_NAME: ${{ steps.prep.outputs.branch_name }}
          PRODUCT: ${{ inputs.product }}
        run: |
          {
            echo "## Limited Release Branch Prepared"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Release Branch** | \`$BRANCH_NAME\` |"
            echo "| **Product** | \`$PRODUCT\` |"
            echo ""
            echo "\`.changeset/config.json\` ignores the other product; its changesets were removed from the"
            echo "branch (they stay on dev). The push opens the limited release PR."
          } >> "$GITHUB_STEP_SUMMARY"
