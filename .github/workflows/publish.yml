name: Publish

permissions:
  contents: read
  pull-requests: write

on:
  # Trigger for canary and stable releases:
  # - Stable prod release: When PR from changeset-release/* branch is merged with [release] prefix
  # - Canary release: Push to any branch below (not from changeset-release merge)
  # Only these release branch types (each job's "Release info" step maps them to npm tags); any
  # other release/* branch (e.g. old release/2.x.x) publishes nothing.
  push:
    branches:
      - dev
      - 'release/latest'
      - 'release/1.x.x'
      - 'release/betas/**'
    paths:
      - '**'

# changesets/action runs csdk:prep-release which consumes .changeset/*.md in that runner.
# Canary snapshot must run in a separate job with its own checkout so changesets still exist.
jobs:
  stable-release-prep:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref_name, 'release/betas') }}
    # One stable run per branch at a time, so overlapping pushes don't race on the API docs push,
    # the release/latest sync and the dev cherry-pick. Never cancel a run that may be publishing.
    concurrency:
      group: stable-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          token: ${{ steps.generate-token.outputs.token }}
          clean-cache: 'true'

      - name: Build packages
        run: npm run build

      - name: Generate API docs
        run: |
          yarn generate-docs
          if [ -n "$(git status --porcelain)" ]; then
            git add ./ref-docs/**/*
            git commit -m "Update API docs [skip ci]" || echo "⚠️ Failed to commit API docs (may already be committed)"
            git push origin HEAD:${{ github.ref_name }} || echo "⚠️ Failed to push API docs (may already be pushed or no changes)"
          else
            echo "No API doc changes to commit"
          fi

      # npm dist-tag and release PR title of this branch's stable releases (betas don't run this job)
      - name: Release info
        id: release-info
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            dev) npm_tag=latest; pr_title="Full release" ;;
            release/latest) npm_tag=latest; pr_title="Latest release" ;;
            release/1.x.x) npm_tag=ver1; pr_title="Legacy release (ver1) - $BRANCH" ;;
            *) echo "::error::$BRANCH has no stable release info"; exit 1 ;;
          esac
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "pr_title=[csdk][release] $pr_title" >> "$GITHUB_OUTPUT"
          echo "$BRANCH: npm_tag=$npm_tag, pr_title=[csdk][release] $pr_title"

      - name: Prepare and Process Changesets Release
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn csdk:prep-release
          publish-script: yarn changeset:publish --tag ${{ steps.release-info.outputs.npm_tag }}
          commit-message: '[release][ci] Version bump and changelog'
          pr-title: ${{ steps.release-info.outputs.pr_title }}
          github-token: ${{ steps.generate-token.outputs.token }}
          push-with-git-cli: true
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Everything after a stable publish, in one idempotent script (scripts/release/post-release-sync.ts):
      # dev: re-create release/latest at the release; release/latest: cherry-pick the version bump
      # onto dev (PR on conflicts).
      # The published packages are changesets/action's output: a re-run publishes nothing, so it
      # skips this step. When it failed, finish the remaining steps by hand.
      # github.sha is the release commit, unaffected by the "Generate API docs" commit on top.
      - name: Post-release sync
        if: steps.changesets.outputs.published == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: yarn csdk:post-release-sync

  canary-snapshot:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          clean-cache: 'true'

      # Canary dist-tag (and version prefix) of this branch; betas: beta.<rest of the branch name>
      - name: Release info
        id: release-info
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            dev | release/latest) canary_prefix=canary ;;
            release/1.x.x) canary_prefix=ver1-canary ;;
            release/betas/*) suffix="${BRANCH#release/betas/}"; canary_prefix="beta.${suffix//\//-}" ;;
            *) echo "::error::$BRANCH has no canary release info"; exit 1 ;;
          esac
          echo "canary_prefix=$canary_prefix" >> "$GITHUB_OUTPUT"
          echo "$BRANCH: canary_prefix=$canary_prefix"

      - name: Build packages
        run: npm run build

      - name: Pre-release canary version bump and snapshot cascade
        id: canary_snapshot
        run: yarn changeset:cascade-snapshot-version
        env:
          CANARY_PREFIX: ${{ steps.release-info.outputs.canary_prefix }}

      - name: Re-Install dependencies
        run: |
          yarn install

      - name: Publish canary snapshot packages to npm
        if: steps.canary_snapshot.outputs.snapshot_publish == 'true'
        env:
          CANARY_PREFIX: ${{ steps.release-info.outputs.canary_prefix }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn build
          yarn changeset:publish --tag $CANARY_PREFIX --no-git-tag

