name: Publish

on:
  # Trigger for canary and stable releases. (release) prefix will trigger full release - otherwise canary
  push:
    branches:
      - dev
      - 'release/**'
    paths:
      - '**'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure action
        id: configure-action
        run: |
          COMMIT_MSG="${{ github.event.push.message }}"
          if [[ "$COMMIT_MSG" =~ ^\(release\) ]]; then
          echo "::set-output name=isFullRelease::true"
          else
          echo "::set-output name=isFullRelease::false"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      - name: Full publish
        if: steps.configure-action.outputs.isFullRelease == 'true'
        run: |
          echo "Full release triggered by commit message: ${{ github.event.head_commit.message }}"
          npx beachball publish --token ${NPM_TOKEN}} --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate API docs
        run: |
          yarn generate-docs
          if [ -n "$(git status --porcelain)" ]; then
            git add ./ref-docs/**/*
            git commit -m "Update API docs"
          else
            echo "No API doc changes to commit"
          fi

      - name: Pre-release version update (Canary - Lerna)
        run: |
          npx lerna version prerelease --preid canary --message "%s [skip ci]" --yes
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Pre-release canary publish (Lerna)
        run: |
          echo //registry.npmjs.org/:_authToken=${NPM_TOKEN} > .npmrc
          npx lerna version prerelease --preid canary --message "%s [skip ci]" --no-git-tag-version --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
