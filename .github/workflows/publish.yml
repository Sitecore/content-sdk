name: Publish

on:
  # Trigger for canary and stable releases:
  # - Full release: When PR from changeset-release/dev branch is merged
  # - Canary release: Push to dev branch (not from changeset-release/dev)
  push:
    branches:
      - dev
      - 'release/**'
    paths:
      - '**'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure action
        id: configure-action
        run: |
          # Check commit message for (release) prefix to determine if this is a full release
          # For push events, head_commit.message contains the commit message
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" =~ ^\[release\] ]]; then
            echo "isFullRelease=true" >> $GITHUB_OUTPUT
          else
            echo "isFullRelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      - name: Generate API docs
        # Generate API docs for both full releases and canary releases
        run: |
          yarn generate-docs
          if [ -n "$(git status --porcelain)" ]; then
            git add ./ref-docs/**/*
            git commit -m "Update API docs [skip ci]" || echo "⚠️ Failed to commit API docs (may already be committed)"
            git push origin HEAD:${{ github.ref_name }} || echo "⚠️ Failed to push API docs (may already be pushed or no changes)"
          else
            echo "No API doc changes to commit"
          fi

      - name: Pre-release version update (Canary)
        if: steps.configure-action.outputs.isFullRelease != 'true' && github.ref_name == 'dev'
        run: |
          echo "Creating canary release on dev branch (no tags)..."
          npx lerna version prerelease --preid canary --message "%s [skip ci]" --sign-git-tag false --yes --no-git-tag-version
          echo "Fixing dependency ranges (removing carets from canary versions)..."
          node scripts/fix-dependency-ranges.js
          yarn install
          git commit -a -m "chore: bump versions for canary release [skip ci]"
          git push origin dev
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Pre-release canary publish
        if: steps.configure-action.outputs.isFullRelease != 'true' && github.ref_name == 'dev'
        run: |
          echo "Publishing canary packages to npm..."
          echo "registry=https://${NPM_REGISTRY}/" > .npmrc
          echo "@sitecore-content-sdk:registry=https://${NPM_REGISTRY}/" >> .npmrc
          echo "//${NPM_REGISTRY}/:_authToken=${NPM_TOKEN}" >> .npmrc
          npx lerna publish from-package --canary --pre-dist-tag canary --preid canary --no-verify-access --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}

      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            @sitecore-content-sdk:registry=https://$NPM_REGISTRY
            registry=https://$NPM_REGISTRY
            //$NPM_REGISTRY/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn prep-release
          publish: yarn changeset:publish
          commit: '[release][ci] changelog, release and version bump'
          title: '[csdk] release'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
