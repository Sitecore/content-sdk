name: Publish

permissions:
  contents: read
  pull-requests: write

on:
  # Trigger for beta.atoms release:
  # - beta.atoms release: Push to release/betas/** branches (not from changeset-release merge)
  # Temp solution for beta release of atoms feature
  push:
    branches:
      - 'release/betas/**'
    paths:
      - '**'

# changesets/action runs csdk:prep-release which consumes .changeset/*.md in that runner.
# beta.atoms snapshot must run in a separate job with its own checkout so changesets still exist.
jobs:
  stable-release-prep:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      - name: Generate API docs
        run: |
          yarn generate-docs
          if [ -n "$(git status --porcelain)" ]; then
            git add ./ref-docs/**/*
            git commit -m "Update API docs [skip ci]" || echo "⚠️ Failed to commit API docs (may already be committed)"
            git push origin HEAD:${{ github.ref_name }} || echo "⚠️ Failed to push API docs (may already be pushed or no changes)"
          else
            echo "No API doc changes to commit"
          fi
      # Present in dev, disabled in betas/* branches. We don't need the formal changeset PR for beta - beta-snapshot handles that
      # - name: Creating .npmrc
      # ...
      # Present in dev, disabled in betas/* branches. We don't need the formal changeset PR for beta - beta-snapshot handles that
      # - name: Prepare and Process Changesets Release
      #  id: changesets
      #  uses: changesets/action@v1

  beta-snapshot:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      - name: Creating .npmrc
        run: |
          NPM_REGISTRY="${NPM_REGISTRY%/}"
          NPM_REGISTRY="${NPM_REGISTRY}/"
          write_npmrc() {
            {
              echo "@sitecore-content-sdk:registry=https://$NPM_REGISTRY"
              echo "registry=https://$NPM_REGISTRY"
              echo "//$NPM_REGISTRY:_authToken=$NPM_TOKEN"
            } > "$1"
          }
          write_npmrc "$GITHUB_WORKSPACE/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}

      - name: Pre-release beta.atoms version bump and snapshot cascade
        id: beta_snapshot
        run: yarn changeset:cascade-snapshot-version

      - name: Re-Install dependencies
        run: |
          yarn install

      - name: Publish beta.atoms snapshot packages to npm
        if: steps.beta_snapshot.outputs.snapshot_publish == 'true'
        env:
          npm_config_ignore_scripts: true # skip lifecycle scripts to avoid running build again during changeset:publish
        run: |
          NPM_TAG="beta.atoms"
          yarn build
          yarn changeset:publish --tag $NPM_TAG --no-git-tag
