name: Publish

permissions:
  contents: read
  pull-requests: write

on:
  # Trigger for canary and stable releases:
  # - Stable prod release: When PR from changeset-release/* branch is merged with [release] prefix
  # - Canary release: Push to dev or release/* branches (not from changeset-release merge)
  push:
    branches:
      - dev
      - 'release/**'
      # Holds released code only; updated by the publish job itself.
      - '!release/latest'
    paths:
      - '**'

# changesets/action runs csdk:prep-release which consumes .changeset/*.md in that runner.
# Canary snapshot must run in a separate job with its own checkout so changesets still exist.
jobs:
  stable-release-prep:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref_name, 'release/betas') }}
    # One stable run per branch at a time, so overlapping pushes don't race on the API docs push,
    # the release/latest sync and the dev cherry-pick. Never cancel a run that may be publishing.
    concurrency:
      group: stable-release-${{ github.ref }}
      cancel-in-progress: false
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          token: ${{ steps.generate-token.outputs.token }}
          clean-cache: 'true'

      - name: Build packages
        run: npm run build

      - name: Generate API docs
        run: |
          yarn generate-docs
          if [ -n "$(git status --porcelain)" ]; then
            git add ./ref-docs/**/*
            git commit -m "Update API docs [skip ci]" || echo "⚠️ Failed to commit API docs (may already be committed)"
            git push origin HEAD:${{ github.ref_name }} || echo "⚠️ Failed to push API docs (may already be pushed or no changes)"
          else
            echo "No API doc changes to commit"
          fi

      # npm dist-tag, release PR title and side-line flag of this branch's release line
      # (scripts/release/release-line.ts, the single source for branch types).
      - name: Release line
        id: release-line
        run: yarn csdk:release-line

      # Guardrail for lines publishing to npm `latest` from a side branch: fail if a version this push
      # is about to publish is already on npm from another line (changeset publish would skip it
      # silently) or is lower than npm `latest` (it would move `latest` back).
      - name: Check release versions against npm
        if: steps.release-line.outputs.side_line == 'true'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: yarn csdk:release-versions-guard

      - name: Prepare and Process Changesets Release
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn csdk:prep-release
          publish-script: yarn changeset:publish --tag ${{ steps.release-line.outputs.npm_tag }}
          commit-message: '[release][ci] Version bump and changelog'
          pr-title: ${{ steps.release-line.outputs.pr_title }}
          github-token: ${{ steps.generate-token.outputs.token }}
          push-with-git-cli: true
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Everything after a stable publish, in one idempotent script (scripts/release/post-release-sync.ts):
      # restore missing <pkg>@<version> tags; create legacy branches after a product major (cut from
      # release/latest before it moves); sync release/latest (dev, limited, hotfix;
      # prep_hotfix_feature_release.yml branches off it); cherry-pick a limited / hotfix version bump
      # onto dev (PR on conflicts).
      # The published packages are derived from the release commit, so a re-run after a partial
      # publish covers the whole release. To recover when this job failed part-way, run the
      # "Post-release Sync" workflow (post_release_sync.yml) on the branch with this commit.
      # github.sha is the release commit, unaffected by the "Generate API docs" commit on top.
      - name: Post-release sync
        if: steps.changesets.outputs.published == 'true'
        env:
          RELEASE_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.before }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: yarn csdk:post-release-sync

  canary-snapshot:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          clean-cache: 'true'

      # Canary dist-tag of this branch's release line (scripts/release/release-line.ts).
      - name: Release line
        id: release-line
        run: yarn csdk:release-line

      - name: Build packages
        run: npm run build

      - name: Pre-release canary version bump and snapshot cascade
        id: canary_snapshot
        run: yarn changeset:cascade-snapshot-version
        env:
          CANARY_PREFIX: ${{ steps.release-line.outputs.canary_prefix }}

      - name: Re-Install dependencies
        run: |
          yarn install

      - name: Publish canary snapshot packages to npm
        if: steps.canary_snapshot.outputs.snapshot_publish == 'true'
        env:
          CANARY_PREFIX: ${{ steps.release-line.outputs.canary_prefix }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn build
          yarn changeset:publish --tag $CANARY_PREFIX --no-git-tag

