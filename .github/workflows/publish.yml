name: Publish

permissions:
  contents: write
  pull-requests: write

on:
  # Trigger for canary and stable releases:
  # - Stable prod release: When PR from changeset-release/* branch is merged with [release] prefix
  # - Canary release: Push to dev or release/* branches (not from changeset-release merge)
  push:
    branches:
      - dev
      - 'release/**'
    paths:
      - '**'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      - name: Generate API docs
        # Generate API docs for both full releases and canary releases
        run: |
          yarn generate-docs
          if [ -n "$(git status --porcelain)" ]; then
            git add ./ref-docs/**/*
            git commit -m "Update API docs [skip ci]" || echo "⚠️ Failed to commit API docs (may already be committed)"
            git push origin HEAD:${{ github.ref_name }} || echo "⚠️ Failed to push API docs (may already be pushed or no changes)"
          else
            echo "No API doc changes to commit"
          fi

      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            @sitecore-content-sdk:registry=https://$NPM_REGISTRY
            registry=https://$NPM_REGISTRY
            //$NPM_REGISTRY/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}

      # ========== CHANGESET ACTION ==========
      # Create/update the release PR with updated versions based on changesets
      # OR
      # Publish to npm when release PR is merged
      - name: Prepare and Process Changesets Release
        id: changesets
        uses: changesets/action@v1
        with:
          # using scripts from monorepo root package.json
          version: yarn csdk:prep-release
          publish: yarn csdk:publish-release
          commit: '[release][ci] Version bump and changelog'
          title: ${{ github.ref_name == 'dev' && '[csdk] latest release' || format('[csdk] patch release - {0}', github.ref_name) }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Pre-release version update (Canary)
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Bumping canary version(s)"

          # If a release was just published, bump to next preminor canary
          if [[ "$RELEASE_PUBLISHED" == "true" ]]; then
            echo "Release was just published - bumping to preminor canary"
            npx lerna version preminor --exact --preid canary --sign-git-tag false --yes --no-git-tag-version
          else
            npx lerna version prerelease --exact --preid canary --sign-git-tag false --yes --no-git-tag-version
          fi

          yarn install
          if [ -n "$(git status --porcelain)" ]; then
            git commit -a -m "Bump canary version [skip ci]"
            git push origin HEAD:$BRANCH_NAME
          else
            echo "No version changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_PUBLISHED: ${{ steps.changesets.outputs.published }}

      - name: Pre-release canary publish
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [[ "$BRANCH_NAME" =~ ^release/ ]]; then
            NPM_TAG="hotfix-canary"
          else
            NPM_TAG="canary"
          fi
          echo "Publishing canary packages to npm..."
          npx lerna publish from-package --canary --pre-dist-tag "$NPM_TAG" --preid canary --no-verify-access --yes
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_REGISTRY: ${{ secrets.NPM_REGISTRY }}
