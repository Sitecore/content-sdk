name: Legacy Changesets Guard

# PR check for legacy lines. A legacy branch holds
# only its product's packages plus create-content-sdk-app (ignored by changesets). Fails on
# changesets the line can't release: for a package that resolves from npm (e.g. a cherry-picked core
# changeset; ship it from dev) or for create-content-sdk-app (would stay pending and silently block
# publishing). Mark this check as required on `release/legacy/**`.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'release/legacy/**'

permissions:
  contents: read

concurrency:
  group: legacy-changesets-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      # The default PR merge ref: the changesets the merge would bring to the legacy branch.
      - name: Checkout PR merge commit
        uses: actions/checkout@v4

      - name: Release setup
        uses: ./.github/actions/release-setup
        with:
          install: update

      - name: Check changesets
        run: yarn csdk:legacy-changesets-guard

