name: Sample App Bundle Size

on:
  pull_request:
    branches: [dev]

jobs:
  check-sample-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for full git history & branch comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run sample app bundle size check
        run: node ./scripts/check-next-bundle.js

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sample-app-bundle
          path: sample-bundle-size.md

