name: Bundle size and Test coverage

on:
  pull_request:
    branches: [dev]

jobs:
  check-bundle-size:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for full git history & branch comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 🔹 BUNDLE SIZE
      - name: Run bundle size comparison
        run: node ./scripts/check-bundle-size.js

      - name: Post PR comment (bundle size)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bundle-size
          path: bundle-size-report.md

      # 🔹 TEST COVERAGE
      - name: Generate coverage markdown
        run: node ./scripts/generate-test-coverage.js

      - name: Post PR comment (test coverage)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-coverage
          path: coverage-report.md
