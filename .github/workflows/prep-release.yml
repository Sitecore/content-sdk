name: Prepare Release Branch

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Short name of package (nextjs, angular, create-content-sdk-app, etc.)'
        required: true
        type: string
      version:
        description: 'Version to patch (e.g., 1.2, 1.2.x, or 1.2.3). Will pick latest released patch'
        required: true
        type: string

jobs:
  prep-release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Validate inputs and put values for further processing into GH output
      - name: Resolve package name
        id: resolve-package
        run: node scripts/resolve-package.js "${{ inputs.package_name }}" >> $GITHUB_OUTPUT

      - name: Parse version input
        id: parse-version
        run: node scripts/parse-version.js "${{ inputs.version }}" >> $GITHUB_OUTPUT

      - name: Find release tag
        id: find-tag
        run: |
          node scripts/find-release-tag.js \
            "${{ steps.resolve-package.outputs.full_name }}" \
            "${{ steps.parse-version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Check if release branch already exists
        id: check-branch
        run: |
          PACKAGE_NAME="${{ steps.resolve-package.outputs.full_name }}"
          NEXT_VERSION="${{ steps.find-tag.outputs.next_version }}"
          BRANCH_NAME="release/${PACKAGE_NAME}@${NEXT_VERSION}"

          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "⚠️ Branch $BRANCH_NAME already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Branch $BRANCH_NAME does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create release branch
        if: steps.check-branch.outputs.exists == 'false'
        run: |
          LATEST_TAG="${{ steps.find-tag.outputs.latest_tag }}"
          BRANCH_NAME="${{ steps.check-branch.outputs.branch_name }}"

          echo "Creating branch $BRANCH_NAME from tag $LATEST_TAG"
          git checkout -b "$BRANCH_NAME" "$LATEST_TAG" || {
            echo "❌ Failed to create branch $BRANCH_NAME"
            exit 1
          }
          git push -u origin "$BRANCH_NAME" || {
            echo "❌ Failed to push branch $BRANCH_NAME"
            exit 1
          }

          echo "✅ Branch $BRANCH_NAME created and pushed"

      - name: Branch already exists
        if: steps.check-branch.outputs.exists == 'true'
        run: |
          BRANCH_NAME="${{ steps.check-branch.outputs.branch_name }}"
          echo "⚠️ Branch $BRANCH_NAME already exists"
          echo "If you want to use it, checkout the branch manually:"
          echo "  git checkout $BRANCH_NAME"
          echo "If you want to recreate it, delete the branch first:"
          echo "  git push origin --delete $BRANCH_NAME"

      - name: Summary
        run: |
          PACKAGE_NAME="${{ steps.resolve-package.outputs.full_name }}"
          BRANCH_NAME="${{ steps.check-branch.outputs.branch_name }}"
          LATEST_TAG="${{ steps.find-tag.outputs.latest_tag }}"
          NEXT_VERSION="${{ steps.find-tag.outputs.next_version }}"

          echo "## Release Branch Prepared" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | \`$PACKAGE_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base tag** | \`$LATEST_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`$BRANCH_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target version** | \`$NEXT_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Checkout the branch: \`git checkout $BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Cherrypick or add patch changes" >> $GITHUB_STEP_SUMMARY
          echo "3. Add changesets (\`yarn changeset\`)" >> $GITHUB_STEP_SUMMARY
          echo "4. Push changes - canary versions will be published automatically" >> $GITHUB_STEP_SUMMARY
          echo "5. Merge patch release PR to trigger the release" >> $GITHUB_STEP_SUMMARY
