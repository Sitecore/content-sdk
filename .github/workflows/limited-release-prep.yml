name: Limited Release Prep

# Which packages do you want to release?
#
# Tick the packages to include in this limited release. Every publishable
# package you leave UNticked is added to `.changeset/config.json`'s `ignore`
# list so `changeset version`/publish only touches the selected ones.
# The change is committed on a fresh `release/limited/<timestamp>` branch.
#
# NOTE: GitHub `workflow_dispatch` has no native multi-select, so each package
# is a boolean checkbox (the "checklist"). Keep this list in sync with the
# publishable workspace packages.
on:
  workflow_dispatch:
    inputs:
      analytics_core:
        description: 'Release @sitecore-content-sdk/analytics-core'
        type: boolean
        default: false
      angular:
        description: 'Release @sitecore-content-sdk/angular'
        type: boolean
        default: false
      cli:
        description: 'Release @sitecore-content-sdk/cli'
        type: boolean
        default: false
      content:
        description: 'Release @sitecore-content-sdk/content'
        type: boolean
        default: false
      core:
        description: 'Release @sitecore-content-sdk/core'
        type: boolean
        default: false
      create_content_sdk_app:
        description: 'Release create-content-sdk-app'
        type: boolean
        default: false
      events:
        description: 'Release @sitecore-content-sdk/events'
        type: boolean
        default: false
      nextjs:
        description: 'Release @sitecore-content-sdk/nextjs'
        type: boolean
        default: false
      personalize:
        description: 'Release @sitecore-content-sdk/personalize'
        type: boolean
        default: false
      react:
        description: 'Release @sitecore-content-sdk/react'
        type: boolean
        default: false
      search:
        description: 'Release @sitecore-content-sdk/search'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prep-limited-release:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set git configuration
        run: |
          git config --global user.email builds@sitecore.com
          git config --global user.name "content-sdk-bot"
          git remote set-url origin https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/${{ github.repository }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install

      - name: Prepare limited release branch
        id: prep
        run: |
          set -euo pipefail
          SELECTED=""
          add() { [ "$1" = "true" ] && SELECTED="$SELECTED $2" || true; }
          add "${{ inputs.analytics_core }}"          "@sitecore-content-sdk/analytics-core"
          add "${{ inputs.angular }}"                 "@sitecore-content-sdk/angular"
          add "${{ inputs.cli }}"                     "@sitecore-content-sdk/cli"
          add "${{ inputs.content }}"                 "@sitecore-content-sdk/content"
          add "${{ inputs.core }}"                    "@sitecore-content-sdk/core"
          add "${{ inputs.create_content_sdk_app }}"  "create-content-sdk-app"
          add "${{ inputs.events }}"                  "@sitecore-content-sdk/events"
          add "${{ inputs.nextjs }}"                  "@sitecore-content-sdk/nextjs"
          add "${{ inputs.personalize }}"             "@sitecore-content-sdk/personalize"
          add "${{ inputs.react }}"                   "@sitecore-content-sdk/react"
          add "${{ inputs.search }}"                  "@sitecore-content-sdk/search"
          SELECTED="$(echo "$SELECTED" | xargs)"  # trim

          if [ -z "$SELECTED" ]; then
            echo "No packages selected. Tick at least one package to release."
            exit 1
          fi
          echo "Selected packages: $SELECTED"

          # Product (nextjs/angular) releases get a dedicated release/limited/<product>-<ts> branch;
          # everything else uses release/limited/<ts>.
          PRODUCT=""
          [ "${{ inputs.nextjs }}" = "true" ] && PRODUCT="nextjs"
          [ "${{ inputs.angular }}" = "true" ] && PRODUCT="${PRODUCT:+$PRODUCT-}angular"
          TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
          if [ -n "$PRODUCT" ]; then
            BRANCH_NAME="release/limited/${PRODUCT}-${TIMESTAMP}"
          else
            BRANCH_NAME="release/limited/${TIMESTAMP}"
          fi
          git checkout -b "$BRANCH_NAME"

          RELEASE_PACKAGES="$SELECTED" yarn csdk:prep-limited-release

          if [ -z "$(git status --porcelain .changeset/config.json)" ]; then
            echo "All publishable packages selected; nothing to ignore — use the normal release flow instead."
            exit 1
          fi
          git add .changeset/config.json
          git commit -m "[release][ci] Limited release: ignore non-selected packages"
          git push -u origin "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "packages=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Limited Release Branch Prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Release Branch** | \`${{ steps.prep.outputs.branch_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Releasing** | \`${{ steps.prep.outputs.packages }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`.changeset/config.json\` \`ignore\` was updated so only the selected packages are released." >> "$GITHUB_STEP_SUMMARY"

