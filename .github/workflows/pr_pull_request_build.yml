name: Pull Request Build

on:
  pull_request:
    branches:
      - dev
      - 'release/**'
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
          dotnet-quality: 'ga'

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      - name: Lint packages
        run: |
          yarn lint-packages

      - name: Verify API surface
        run: |
          yarn api-extractor:verify

      - name: Run tests and collect coverage
        run: yarn coverage-packages
        env:
          testEnv: ci
          IMPORT_ALIAS_STRATEGY: plain

      - name: Generate code coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: '**/cobertura-coverage.xml'
          targetdir: './coverlet'
          reporttypes: 'HtmlInline;MarkdownSummaryGithub;Cobertura'

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverlet

      - name: Publish coverage in build summary
        run: cat coverlet/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        shell: bash

      # Release scripts are maintained on dev. A legacy branch holds only its product's packages, so
      # the tests that read the full workspace can't pass there.
      - name: Run tests for release scripts
        if: ${{ !startsWith(github.base_ref, 'release/legacy/') }}
        run: yarn changeset:test

      # publish.yml and pr_release_branch_guards.yml run these with plain node (Node 24 type
      # stripping), which vitest doesn't exercise: a local import without its .ts extension or a
      # type imported without `type` only fails here. Read-only runs on branches without guards.
      - name: Smoke-test release scripts run by plain node
        if: ${{ !startsWith(github.base_ref, 'release/legacy/') }}
        run: |
          node ./scripts/release/release-info.ts dev
          node ./scripts/release/release-branch-guards.ts dev

      # Legacy branches (release/legacy/<product>/v<N>) hold only their product, so scaffold only
      # its samples; everywhere else scaffold all products' samples.
      - name: Scaffold samples
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          PRODUCT=""
          if [[ "$BASE_REF" == release/legacy/* ]]; then
            PRODUCT=$(echo "$BASE_REF" | cut -d/ -f3)
          fi
          yarn scaffold-samples $PRODUCT
