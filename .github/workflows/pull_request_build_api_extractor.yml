name: Pull Request Build - chore/api-extractor

on:
  pull_request:
    branches:
      - dev
      - 'release/**'
    paths:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
          dotnet-quality: 'ga'

      - name: Install dependencies
        run: |
          yarn cache clean --all
          yarn install --immutable

      - name: Build packages
        run: npm run build

      # API Extractor verifies that public API changes are properly documented
      # and helps prevent accidental breaking changes to the public API surface
      - name: Verify API surface
        run: |
          echo "🔍 Checking API Extractor configuration..."
          echo ""
          echo "🔍 Verifying API surface compatibility..."
          if ! yarn api-extractor:verify; then
            echo ""
            echo "❌ API Extractor verification failed!"
            echo ""
            echo "🔧 To fix this issue:"
            echo "   1. Run 'yarn api-extractor' locally to update API reports"
            echo "   2. Review the changes in the generated .api.md files"
            echo "   3. Commit the updated API reports if the changes are intentional"
            echo ""
            echo "📋 This ensures API changes are properly reviewed and documented."
            echo ""
            exit 1
          fi
          echo "✅ API surface verification passed!"

      - name: Upload API reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            packages/*/api/*.api.md
            packages/*/temp/*.api.md
          retention-days: 7

      - name: Lint packages
        run: |
          yarn lint-packages

      - name: Run tests and collect coverage
        run: yarn coverage-packages
        env:
          testEnv: ci

      - name: Generate code coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: '**/cobertura-coverage.xml'
          targetdir: './coverlet'
          reporttypes: 'HtmlInline;MarkdownSummaryGithub;Cobertura'

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverlet

      - name: Publish coverage in build summary
        run: cat coverlet/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Scaffold samples
        run: yarn scaffold-samples
